resources:
  cpus: 8
  memory: 16
  disk_size: 100

num_nodes: 1

workdir: .

file_mounts:
  /opencog_experiments: 
    name: # Optional: specify bucket name for persistent storage
    mode: MOUNT

setup: |
  # Update system packages
  sudo apt-get update
  
  # Install comprehensive build tools and dependencies
  sudo apt-get install -y \
    build-essential \
    cmake \
    git \
    libboost-all-dev \
    python3-dev \
    python3-pip \
    cython3 \
    python3-setuptools \
    pkg-config \
    libgmp-dev \
    libtbb-dev \
    uuid-dev \
    libssl-dev \
    libxml2-dev \
    libxslt1-dev \
    zlib1g-dev \
    libffi-dev
  
  # Install Python scientific computing stack
  pip3 install --user \
    numpy \
    scipy \
    matplotlib \
    pandas \
    scikit-learn \
    jupyter \
    notebook \
    ipython \
    networkx \
    plotly \
    seaborn
  
  # Install OpenCog packages if available
  pip3 install --user opencog atomspace || echo "OpenCog packages will be built from source"
  
  # Create workspace directory
  mkdir -p /opencog_experiments/workspace
  mkdir -p /opencog_experiments/data
  mkdir -p /opencog_experiments/results
  
  # Set up comprehensive OpenCog environment
  echo 'export PYTHONPATH=/usr/local/lib/python3/dist-packages:$PYTHONPATH' >> ~/.bashrc
  echo 'export OPENCOG_SOURCE_DIR=$HOME/opencog' >> ~/.bashrc

run: |
  source ~/.bashrc
  
  echo "===== OpenCog Development Environment Setup Complete ====="
  echo "OpenCog installation details:"
  echo "  Workspace: /opencog_experiments/workspace"
  echo "  Data: /opencog_experiments/data"
  echo "  Results: /opencog_experiments/results"
  echo ""
  
  # Test Python environment
  python3 -c "import numpy, scipy, matplotlib; print('Scientific Python stack ready')"
  python3 -c "import networkx; print('NetworkX for graph processing ready')"
  
  echo ""
  echo "===== Development Environment Ready ====="
  echo ""
  echo "Available commands:"
  echo "  python3          - Python with scientific libraries"
  echo "  jupyter notebook - Start Jupyter for interactive development"
  echo ""
  echo "SSH into this instance for development:"
  echo "  sky ssh opencog-dev"
  echo ""
  echo "Directory structure:"
  echo "  /opencog_experiments/    - Your persistent experiments"
  echo ""
  
  # Keep running for development
  echo "Development environment is ready. Use 'sky down opencog-dev' to terminate."
  sleep infinity