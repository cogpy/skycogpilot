resources:
  accelerators: V100:1  # Can be changed to other GPUs like A100, T4, etc.
  cpus: 8
  memory: 16
  disk_size: 100

num_nodes: 1

workdir: .

setup: |
  # Update system packages
  sudo apt-get update
  
  # Install NVIDIA drivers and CUDA (if not already available)
  sudo apt-get install -y nvidia-driver-470 || echo "GPU drivers may already be installed"
  
  # Install OpenCog dependencies
  sudo apt-get install -y \
    build-essential \
    cmake \
    git \
    libboost-all-dev \
    libcogutil-dev \
    libatomspace-dev \
    python3-dev \
    python3-pip \
    cython3 \
    python3-setuptools \
    python3-distutils \
    pkg-config \
    libssl-dev \
    libzmq3-dev
  
  # Install Python packages with GPU support
  pip3 install --user \
    opencog \
    atomspace \
    torch torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cu118 \
    tensorflow-gpu \
    numpy \
    scipy \
    matplotlib \
    pandas \
    scikit-learn \
    jupyter \
    transformers \
    accelerate \
    datasets \
    nltk \
    spacy
  
  # Install OpenCog from source with GPU optimizations
  git clone https://github.com/opencog/opencog.git
  cd opencog
  mkdir build
  cd build
  cmake -DCMAKE_BUILD_TYPE=Release -DWITH_MPI=ON ..
  make -j$(nproc)
  sudo make install
  cd ../..
  
  # Set up environment
  echo 'export PYTHONPATH=/usr/local/lib/python3/dist-packages:$PYTHONPATH' >> ~/.bashrc
  echo 'export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH' >> ~/.bashrc
  echo 'export CUDA_VISIBLE_DEVICES=0' >> ~/.bashrc

run: |
  source ~/.bashrc
  
  echo "===== OpenCog GPU Environment Setup ====="
  echo ""
  
  # Check GPU availability
  echo "=== GPU Information ==="
  nvidia-smi || echo "NVIDIA tools not available, but GPU may still work"
  echo ""
  
  # Test PyTorch GPU support
  cat > test_gpu_pytorch.py << 'EOF'
import torch
print(f"PyTorch version: {torch.__version__}")
print(f"CUDA available: {torch.cuda.is_available()}")
if torch.cuda.is_available():
    print(f"CUDA version: {torch.version.cuda}")
    print(f"GPU device: {torch.cuda.get_device_name(0)}")
    print(f"GPU memory: {torch.cuda.get_device_properties(0).total_memory / 1e9:.1f} GB")
EOF
  
  python3 test_gpu_pytorch.py
  
  echo ""
  echo "=== OpenCog GPU Test ==="
  
  # Test OpenCog with GPU-accelerated components
  cat > test_gpu_opencog.py << 'EOF'
from opencog.atomspace import AtomSpace, types
from opencog.utilities import initialize_opencog
import numpy as np
import torch

print("Testing OpenCog with GPU acceleration...")

# Initialize AtomSpace
atomspace = AtomSpace()
initialize_opencog(atomspace)

# Create a large knowledge base for GPU processing
print("Creating large knowledge base...")
concepts = []
for i in range(1000):
    concept = atomspace.add_node(types.ConceptNode, f"concept_{i}")
    concepts.append(concept)

# Create relationships
for i in range(500):
    link = atomspace.add_link(types.InheritanceLink, 
                             [concepts[i], concepts[i + 500]])

print(f"Created knowledge base with {len(atomspace)} atoms")

# Demonstrate GPU acceleration potential
if torch.cuda.is_available():
    print("\nDemonstrating GPU tensor operations for AI reasoning...")
    
    # Create random embeddings for concepts (simulation)
    concept_embeddings = torch.randn(1000, 512, device="cuda")
    
    # Simulate similarity computation
    similarities = torch.mm(concept_embeddings, concept_embeddings.t())
    
    print(f"Computed similarity matrix: {similarities.shape} on GPU")
    print(f"Max similarity: {similarities.max().item():.3f}")
    print(f"GPU memory used: {torch.cuda.memory_allocated() / 1e6:.1f} MB")
    
    # Clear GPU memory
    torch.cuda.empty_cache()
    
print("\nOpenCog GPU environment ready for AGI research!")
EOF
  
  python3 test_gpu_opencog.py
  
  echo ""
  echo "===== GPU Environment Ready ====="
  echo ""
  echo "Available capabilities:"
  echo "  ✓ OpenCog AtomSpace with GPU acceleration support"
  echo "  ✓ PyTorch with CUDA for neural network integration"
  echo "  ✓ TensorFlow with GPU support"
  echo "  ✓ Large-scale knowledge graph processing"
  echo ""
  echo "Use cases:"
  echo "  - Neural-symbolic AI integration"
  echo "  - Large-scale reasoning with GPU acceleration"
  echo "  - Hybrid AGI architectures"
  echo "  - Deep learning + symbolic reasoning"
  echo ""
  echo "SSH into this instance for development:"
  echo "  sky ssh opencog-gpu"
  echo ""
  
  # Keep running
  echo "GPU environment ready. Use 'sky down opencog-gpu' to terminate."
  sleep infinity