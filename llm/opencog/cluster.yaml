resources:
  cpus: 4
  memory: 8
  disk_size: 50

num_nodes: 3  # Multi-node setup for distributed reasoning

workdir: .

setup: |
  # Update system packages
  sudo apt-get update
  
  # Install OpenCog dependencies
  sudo apt-get install -y \
    build-essential \
    cmake \
    git \
    libboost-all-dev \
    libcogutil-dev \
    libatomspace-dev \
    python3-dev \
    python3-pip \
    cython3 \
    python3-setuptools \
    python3-distutils \
    pkg-config \
    libzmq3-dev \
    libssl-dev \
    openmpi-bin \
    openmpi-common \
    libopenmpi-dev
  
  # Install Python packages for distributed computing
  pip3 install --user \
    opencog \
    atomspace \
    mpi4py \
    numpy \
    scipy \
    matplotlib \
    pandas \
    pyzmq \
    msgpack \
    redis
  
  # Install OpenCog with distributed support
  git clone https://github.com/opencog/opencog.git
  cd opencog
  mkdir build
  cd build
  cmake -DWITH_MPI=ON -DCMAKE_BUILD_TYPE=Release ..
  make -j$(nproc)
  sudo make install
  cd ../..
  
  # Set up environment
  echo 'export PYTHONPATH=/usr/local/lib/python3/dist-packages:$PYTHONPATH' >> ~/.bashrc
  echo 'export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH' >> ~/.bashrc
  
  # Create distributed OpenCog script
  cat > ~/distributed_opencog.py << 'EOF'
#!/usr/bin/env python3
"""
Distributed OpenCog Example

This script demonstrates running OpenCog across multiple nodes
for distributed AGI reasoning.
"""

import os
import socket
from opencog.atomspace import AtomSpace, types
from opencog.utilities import initialize_opencog
from opencog.type_constructors import *

def get_node_info():
    """Get information about this node."""
    hostname = socket.gethostname()
    node_rank = int(os.environ.get('SKYPILOT_NODE_RANK', 0))
    node_ips = os.environ.get('SKYPILOT_NODE_IPS', '').split()
    return hostname, node_rank, node_ips

def create_distributed_knowledge_base(atomspace, node_rank, total_nodes):
    """Create part of the knowledge base on this node."""
    
    print(f"Node {node_rank}: Creating knowledge partition...")
    
    # Each node creates a portion of the knowledge base
    start_idx = node_rank * 100
    end_idx = (node_rank + 1) * 100
    
    concepts = []
    for i in range(start_idx, end_idx):
        concept = ConceptNode(f'concept_{i}')
        atomspace.add_atom(concept)
        concepts.append(concept)
    
    # Create some relationships within this partition
    for i in range(len(concepts) - 1):
        if i % 10 == 0:  # Create some inheritance links
            link = InheritanceLink(concepts[i], concepts[i + 1])
            atomspace.add_atom(link)
    
    print(f"Node {node_rank}: Created {len(concepts)} concepts and relationships")
    print(f"Node {node_rank}: AtomSpace size: {len(atomspace)}")

def simulate_distributed_reasoning(atomspace, node_rank, node_ips):
    """Simulate distributed reasoning across nodes."""
    
    print(f"Node {node_rank}: Starting distributed reasoning simulation...")
    
    # Count different types of atoms
    concept_count = 0
    link_count = 0
    
    for atom in atomspace:
        if atom.type == types.ConceptNode:
            concept_count += 1
        elif atom.type == types.InheritanceLink:
            link_count += 1
    
    print(f"Node {node_rank}: Local statistics:")
    print(f"  Concepts: {concept_count}")
    print(f"  Links: {link_count}")
    print(f"  Total atoms: {len(atomspace)}")
    
    # In a real distributed system, nodes would communicate here
    # For this demo, we just show what each node would contribute
    print(f"Node {node_rank}: Would share {concept_count} concepts with other nodes")

def main():
    """Main function for distributed OpenCog."""
    
    hostname, node_rank, node_ips = get_node_info()
    total_nodes = len(node_ips)
    
    print(f"Distributed OpenCog Node {node_rank}")
    print(f"Hostname: {hostname}")
    print(f"Total nodes: {total_nodes}")
    print(f"Node IPs: {', '.join(node_ips)}")
    print("=" * 50)
    
    # Initialize AtomSpace
    atomspace = AtomSpace()
    initialize_opencog(atomspace)
    
    # Create distributed knowledge base
    create_distributed_knowledge_base(atomspace, node_rank, total_nodes)
    
    # Simulate distributed reasoning
    simulate_distributed_reasoning(atomspace, node_rank, node_ips)
    
    print(f"Node {node_rank}: Distributed OpenCog setup complete!")

if __name__ == "__main__":
    main()
EOF
  
  chmod +x ~/distributed_opencog.py

run: |
  source ~/.bashrc
  
  echo "===== Distributed OpenCog Cluster Setup ====="
  echo ""
  
  # Get node information
  NODE_RANK=${SKYPILOT_NODE_RANK:-0}
  NODE_IPS=(${SKYPILOT_NODE_IPS})
  TOTAL_NODES=${#NODE_IPS[@]}
  
  echo "Node Information:"
  echo "  Node Rank: $NODE_RANK"
  echo "  Total Nodes: $TOTAL_NODES"
  echo "  Node IPs: ${NODE_IPS[*]}"
  echo "  Hostname: $(hostname)"
  echo ""
  
  # Run the distributed OpenCog script
  echo "Starting distributed OpenCog on node $NODE_RANK..."
  python3 ~/distributed_opencog.py
  
  echo ""
  echo "===== Node $NODE_RANK Ready ====="
  echo ""
  
  if [ "$NODE_RANK" -eq 0 ]; then
    echo "Master node (rank 0) summary:"
    echo "  ✓ Distributed OpenCog cluster initialized"
    echo "  ✓ $TOTAL_NODES nodes participating"
    echo "  ✓ Each node has its own AtomSpace partition"
    echo ""
    echo "In a production setup, nodes would:"
    echo "  - Share knowledge via network protocols"
    echo "  - Coordinate distributed reasoning"
    echo "  - Balance computational load"
    echo ""
    echo "Access individual nodes:"
    for i in $(seq 0 $((TOTAL_NODES-1))); do
      echo "  sky ssh opencog-cluster --node-rank $i"
    done
  else
    echo "Worker node (rank $NODE_RANK) ready and waiting for coordination..."
  fi
  
  echo ""
  echo "Cluster ready. Use 'sky down opencog-cluster' to terminate all nodes."
  
  # Keep nodes running
  sleep infinity