resources:
  cpus: 4
  memory: 8
  disk_size: 50

num_nodes: 1

workdir: .

setup: |
  # Update system packages
  sudo apt-get update
  
  # Install essential build tools and dependencies
  sudo apt-get install -y \
    build-essential \
    cmake \
    git \
    libboost-all-dev \
    libcogutil-dev \
    libatomspace-dev \
    python3-dev \
    python3-pip \
    cython3 \
    python3-setuptools \
    python3-distutils \
    pkg-config
  
  # Install Python dependencies
  pip3 install --user \
    opencog \
    atomspace \
    numpy \
    scipy \
    matplotlib \
    jupyter
  
  # Clone OpenCog repository for examples
  git clone https://github.com/opencog/opencog.git
  cd opencog
  mkdir build
  cd build
  cmake ..
  make -j$(nproc)
  sudo make install
  cd ../..
  
  # Set up OpenCog Python environment
  echo 'export PYTHONPATH=/usr/local/lib/python3/dist-packages:$PYTHONPATH' >> ~/.bashrc
  echo 'export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH' >> ~/.bashrc

run: |
  source ~/.bashrc
  
  echo "===== OpenCog Basic Setup Complete ====="
  echo "OpenCog version: $(opencog --version || echo 'OpenCog installed successfully')"
  echo ""
  
  # Test OpenCog installation
  cat > test_opencog.py << 'EOF'
from opencog.atomspace import AtomSpace, types
from opencog.utilities import initialize_opencog

# Initialize OpenCog
atomspace = AtomSpace()
initialize_opencog(atomspace)

print("OpenCog AtomSpace initialized successfully!")
print(f"AtomSpace size: {len(atomspace)}")

# Create some basic atoms
concept_node = atomspace.add_node(types.ConceptNode, "Hello")
predicate_node = atomspace.add_node(types.PredicateNode, "test")

print(f"Created ConceptNode: {concept_node}")
print(f"Created PredicateNode: {predicate_node}")

# List all atoms
print("\nAll atoms in AtomSpace:")
for atom in atomspace:
    print(f"  {atom}")
EOF
  
  python3 test_opencog.py
  
  echo ""
  echo "===== Basic OpenCog test completed successfully! ====="
  echo "You can SSH into this instance to run more OpenCog experiments:"
  echo "  sky ssh opencog-basic"
  echo ""
  echo "Available OpenCog Python modules:"
  python3 -c "import opencog; print('opencog:', opencog.__file__)"
  python3 -c "import opencog.atomspace; print('atomspace: OK')"
  
  # Keep the instance running for interactive use
  echo "Instance will remain running. Use 'sky down opencog-basic' to terminate."
  sleep infinity