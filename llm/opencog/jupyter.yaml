resources:
  cpus: 4
  memory: 8
  disk_size: 50

num_nodes: 1

workdir: .

ports: 8888

setup: |
  # Update system packages
  sudo apt-get update
  
  # Install OpenCog dependencies
  sudo apt-get install -y \
    build-essential \
    cmake \
    git \
    libboost-all-dev \
    libcogutil-dev \
    libatomspace-dev \
    python3-dev \
    python3-pip \
    cython3 \
    python3-setuptools \
    python3-distutils \
    pkg-config
  
  # Install Jupyter and data science stack
  pip3 install --user \
    opencog \
    atomspace \
    jupyter \
    notebook \
    ipython \
    numpy \
    scipy \
    matplotlib \
    pandas \
    plotly \
    networkx \
    graphviz \
    ipywidgets \
    jupyterlab
  
  # Install OpenCog
  git clone https://github.com/opencog/opencog.git
  cd opencog
  mkdir build
  cd build
  cmake ..
  make -j$(nproc)
  sudo make install
  cd ../..
  
  # Set up environment
  echo 'export PYTHONPATH=/usr/local/lib/python3/dist-packages:$PYTHONPATH' >> ~/.bashrc
  echo 'export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH' >> ~/.bashrc
  
  # Create Jupyter notebook directory with simple example
  mkdir -p ~/notebooks
  
  # Create a simple Python example file for OpenCog
  echo 'print("Welcome to OpenCog with Jupyter!")' > ~/notebooks/opencog_example.py
  echo 'print("This environment is ready for OpenCog development.")' >> ~/notebooks/opencog_example.py

run: |
  source ~/.bashrc
  
  echo "===== Starting OpenCog Jupyter Environment ====="
  echo ""
  
  # Test Python installation
  python3 -c "print('Python environment ready for OpenCog development!')"
  
  echo ""
  echo "===== Jupyter Notebook Server Starting ====="
  echo ""
  echo "Jupyter will be available at:"
  echo "  http://localhost:8888"
  echo ""
  echo "If running on a cloud instance, you may need to set up port forwarding:"
  echo "  sky launch -c opencog-jupyter jupyter.yaml"
  echo "  ssh -L 8888:localhost:8888 opencog-jupyter"
  echo ""
  
  # Start Jupyter notebook
  cd ~/notebooks
  python3 -m jupyter notebook \
    --ip=0.0.0.0 \
    --port=8888 \
    --no-browser \
    --allow-root \
    --NotebookApp.token='' \
    --NotebookApp.password=''